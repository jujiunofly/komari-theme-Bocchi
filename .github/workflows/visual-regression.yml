name: Visual Regression

on:
  pull_request:
  push:
    branches:
      - 1.0.0

permissions:
  contents: write

concurrency:
  group: visual-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Compare visual snapshots
        if: "${{ github.event_name != 'push' || contains(github.event.head_commit.message, 'test: update visual snapshots') }}"
        run: bun run test:visual

      - name: Refresh visual snapshots
        if: "${{ github.event_name == 'push' && github.ref == 'refs/heads/1.0.0' && !contains(github.event.head_commit.message, 'test: update visual snapshots') }}"
        run: bun run test:visual:update

      - name: Commit updated snapshots
        if: "${{ github.event_name == 'push' && github.ref == 'refs/heads/1.0.0' && !contains(github.event.head_commit.message, 'test: update visual snapshots') }}"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/visual/snapshots
          if git diff --cached --quiet; then
            echo "Visual snapshots already match this version."
          else
            git commit -m "test: update visual snapshots"
            git push
          fi

      - name: Upload visual differences
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: visual-regression-diffs
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14
